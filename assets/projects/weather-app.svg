<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="wthBg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B132B"/>
      <stop offset="1" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="tempGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#wthBg)" rx="16"/>

  <!-- Subtle Grid -->
  <path d="M0 60 H800 M0 280 H800 M260 0 V500 M540 60 V500" stroke="#334155" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="800" height="48" fill="#0B132B" rx="16 16 0 0"/>
  <circle cx="28" cy="24" r="5.5" fill="#EF4444"/>
  <circle cx="46" cy="24" r="5.5" fill="#F59E0B"/>
  <circle cx="64" cy="24" r="5.5" fill="#10B981"/>
  <text x="400" y="29" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1">ATMOS — REAL-TIME WEATHER RADAR &amp; FORECAST</text>

  <!-- Left Sidebar (Current Location / Primary Metric) -->
  <rect x="24" y="68" width="220" height="408" rx="14" fill="#141E38" stroke="#2D3B60"/>
  
  <text x="44" y="104" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#38BDF8" letter-spacing="1">CURRENT LOCATION</text>
  <text x="44" y="132" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">New Delhi, IN</text>
  <text x="44" y="152" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">28.6139° N, 77.2090° E</text>

  <!-- Sun Graphic -->
  <circle cx="134" cy="226" r="36" fill="url(#sunGlow)"/>
  <circle cx="134" cy="226" r="44" stroke="#FDE68A" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.5"/>
  <text x="134" y="294" text-anchor="middle" font-family="Inter, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">29°C</text>
  <text x="134" y="316" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#38BDF8">Clear Skies &amp; Sunny</text>

  <path d="M44 340 H224" stroke="#2D3B60"/>
  
  <text x="44" y="366" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">Humidity: <tspan font-weight="700" fill="#F8FAFC">48%</tspan></text>
  <text x="44" y="392" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">Wind Speed: <tspan font-weight="700" fill="#F8FAFC">14 km/h</tspan></text>
  <text x="44" y="418" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">Air Quality Index: <tspan font-weight="700" fill="#10B981">42 (Good)</tspan></text>
  <text x="44" y="444" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">Pressure: <tspan font-weight="700" fill="#F8FAFC">1013 hPa</tspan></text>

  <!-- Main Center Chart: 24h Temperature Curve -->
  <rect x="264" y="68" width="512" height="236" rx="14" fill="#141E38" stroke="#2D3B60"/>
  <text x="288" y="98" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">24-Hour Temperature Curve</text>
  <text x="750" y="98" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8">Live API Fetch</text>

  <!-- Chart Curve -->
  <path d="M288 230 C 350 210, 380 140, 440 130 C 500 120, 550 180, 620 160 C 690 140, 720 180, 750 200" fill="none" stroke="url(#tempGrad)" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Points -->
  <circle cx="288" cy="230" r="4" fill="#38BDF8"/>
  <circle cx="440" cy="130" r="5" fill="#818CF8" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="620" cy="160" r="4" fill="#F472B6"/>
  <circle cx="750" cy="200" r="4" fill="#F472B6"/>

  <text x="288" y="254" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">06:00 (22°)</text>
  <text x="440" y="116" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#818CF8">14:00 (31° Peak)</text>
  <text x="620" y="184" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">18:00 (27°)</text>
  <text x="750" y="224" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">22:00 (24°)</text>

  <!-- 5-Day Forecast Strip -->
  <rect x="264" y="320" width="512" height="156" rx="14" fill="#141E38" stroke="#2D3B60"/>
  <text x="288" y="348" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">5-Day Extended Forecast</text>

  <!-- Day Columns -->
  <g transform="translate(288, 362)">
    <rect x="0" y="0" width="86" height="96" rx="8" fill="#1A2544" stroke="#2D3B60"/>
    <text x="43" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Mon</text>
    <text x="43" y="46" text-anchor="middle" font-size="18">☀️</text>
    <text x="43" y="72" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">30° / 21°</text>
    <text x="43" y="86" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#94A3B8">Sunny</text>
  </g>

  <g transform="translate(386, 362)">
    <rect x="0" y="0" width="86" height="96" rx="8" fill="#1A2544" stroke="#2D3B60"/>
    <text x="43" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Tue</text>
    <text x="43" y="46" text-anchor="middle" font-size="18">⛅</text>
    <text x="43" y="72" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">28° / 20°</text>
    <text x="43" y="86" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#94A3B8">Partly Cloudy</text>
  </g>

  <g transform="translate(484, 362)">
    <rect x="0" y="0" width="86" height="96" rx="8" fill="#1A2544" stroke="#2D3B60"/>
    <text x="43" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Wed</text>
    <text x="43" y="46" text-anchor="middle" font-size="18">🌧️</text>
    <text x="43" y="72" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">25° / 19°</text>
    <text x="43" y="86" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#38BDF8">Scattered Rain</text>
  </g>

  <g transform="translate(582, 362)">
    <rect x="0" y="0" width="86" height="96" rx="8" fill="#1A2544" stroke="#2D3B60"/>
    <text x="43" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Thu</text>
    <text x="43" y="46" text-anchor="middle" font-size="18">⛈️</text>
    <text x="43" y="72" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">23° / 18°</text>
    <text x="43" y="86" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#F472B6">Thunderstorms</text>
  </g>

  <g transform="translate(680, 362)">
    <rect x="0" y="0" width="86" height="96" rx="8" fill="#1A2544" stroke="#2D3B60"/>
    <text x="43" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Fri</text>
    <text x="43" y="46" text-anchor="middle" font-size="18">☀️</text>
    <text x="43" y="72" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">27° / 19°</text>
    <text x="43" y="86" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#94A3B8">Clear Sky</text>
  </g>
</svg>
